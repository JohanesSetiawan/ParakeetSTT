name: tests

# Runs the checkpoint-free tiers (unit and regression) on every pull request
# and on every push to main. The full tier needs the 2.5 GB checkpoint, so it
# skips itself here and runs on the development machine instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # PyTorch is installed from its CPU index because the right wheel depends
      # on the platform; it is deliberately not listed in requirements.txt.
      - name: Install PyTorch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --no-cache-dir

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt --no-cache-dir

      - name: Run unit and regression tiers
        run: python -m pytest -m "not full" --durations=10
