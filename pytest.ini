[pytest]
testpaths = tests
# The repository root makes `src` importable; tests/ makes the shared
# `support` helpers importable from every tier.
pythonpath = . tests
addopts = -ra --strict-markers --strict-config
# A test marked xfail that starts passing fails the run, so a fixed known
# defect cannot go unnoticed.
xfail_strict = true
markers =
    unit: fast isolated tests with tiny fixtures; no checkpoint, no GPU
    regression: one test per fixed defect; tiny fixtures, no checkpoint
    full: end-to-end tests with the real checkpoint and real speech
    cuda: needs a CUDA device
