# Runtime configuration for the standalone Parakeet TDT runtime.
# Relative paths resolve against the repository root, not the working directory.

[paths]
weights_dir = "weights/parakeet-tdt-0.6b-v3"
log_dir = "logs"
# Benchmark results (JSON lines), see `python -m src.commands.benchmark`.
metrics_dir = "metrics"

[logging]
# Python logging level for the dated run log (DEBUG adds per-batch detail).
level = "INFO"

[checkpoint]
request_timeout_seconds = 120.0
download_attempts = 3
# Wait before retry N is retry_backoff_seconds * N.
retry_backoff_seconds = 2.0
stream_block_bytes = 1048576

[inference]
batch_size = 8
recursive = true
output_filename = "transcriptions.csv"
# Empty list means every file is content-probed instead of filtered by extension.
audio_extensions = []
max_chunk_feature_frames = 1500
overlap_feature_frames = 50
max_batch_feature_frames = 3000
max_padding_fraction = 0.25
# How far apart two neighbouring chunks may place the same word in time
# (feature frames of 10 ms). Measured drift reaches about 0.5 s, so 100 frames
# (1.0 s) leaves margin. 0 disables overlap alignment at chunk seams.
merge_tolerance_feature_frames = 100
# Decoder collapse recovery. On some windows the model skips seconds of clear
# speech (the reference implementation does the same on the same samples).
# A stretch of a chunk's core longer than untranscribed_gap_seconds with no
# word, whose RMS is at least gap_silence_rms (about -60 dBFS), is re-decoded
# with the window start moved by each offset in turn (feature frames of 10 ms,
# at most overlap_feature_frames in size). An empty list disables recovery.
untranscribed_gap_seconds = 4.0
gap_silence_rms = 0.001
recovery_start_offsets_feature_frames = [-25, 25, -50, 50]
# Minimum wall-clock gap between two terminal progress lines.
progress_interval_seconds = 2.0
# Most multi-chunk files decoded at the same time. Each one holds an open
# decoder (a file handle, or an ffmpeg process for formats libsndfile cannot
# read) and its overlap tail until its last chunk, so a folder of hundreds of
# long files must not open them all at once. Single-chunk files do not count.
max_open_files = 8

[memory]
# GPU only (ignored on CPU and MPS). After the model loads, PyTorch is capped
# to the VRAM that is actually free minus reserve_mib. On Windows an
# over-allocation would otherwise spill silently into shared system memory and
# run several times slower instead of failing.
cap_to_free_memory = true
# Measure the memory of one and of three full chunks after loading and lower
# inference.max_batch_feature_frames, when needed, to what fits under that
# cap. The configured value stays the upper limit; it is never raised.
auto_batch_budget = true
# VRAM kept free for the CUDA context, library workspaces, and other programs.
reserve_mib = 512

[benchmark]
# Development benchmark: rounds run and discarded before measuring (CUDA
# kernel selection, file cache), then rounds that are measured and compared.
warmup_rounds = 1
measured_rounds = 3
