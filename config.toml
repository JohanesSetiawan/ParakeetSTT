# Runtime configuration for the standalone Parakeet TDT runtime.
# Relative paths resolve against the repository root, not the working directory.

[paths]
weights_dir = "weights/parakeet-tdt-0.6b-v3"
log_dir = "logs"
# Benchmark results (JSON lines), see `python -m src.commands.benchmark`.
metrics_dir = "metrics"

[logging]
# Python logging level for the dated run log (DEBUG adds per-batch detail).
level = "INFO"
# false: the terminal shows the device, progress, results, and warnings, and
# the startup and timing details go to the run log only. true: the terminal
# also shows them (versions, precision, memory budget, stage timings).
terminal_details = false

[checkpoint]
request_timeout_seconds = 120.0
download_attempts = 3
# Wait before retry N is retry_backoff_seconds * N.
retry_backoff_seconds = 2.0
stream_block_bytes = 1048576
# model.safetensors (2.5 GB, the verified download) is only read to build
# model.pth. With false it is deleted once model.pth has been converted from
# it and loaded successfully; a later repair downloads it again. true keeps
# it, so a repair works offline.
keep_safetensors = false

[inference]
# Settings set to "auto" are decided at startup for the computer in use, and
# each decision is written to the run log with its reason (run
# `python -m src.commands.doctor` to see them). A number or true/false
# instead is used as written.
#
# Most rows (chunks) in one batch. "auto": a share of the full chunks that
# fit in the free GPU memory, measured at startup (see [memory]
# auto_batch_memory_share, auto_batch_max_rows, unmeasured_batch_rows).
# Larger batches were never slower on the reference GPU.
batch_size = "auto"
recursive = true
output_filename = "transcriptions.csv"
# Empty list means every file is content-probed instead of filtered by extension.
audio_extensions = []
max_chunk_feature_frames = 1500
overlap_feature_frames = 50
# Upper limit on a batch's padded size (rows x longest row). "auto": what
# the batch rows need. A number is lowered at startup, when needed, to what
# fits in the free GPU memory (memory.auto_batch_budget).
max_batch_feature_frames = "auto"
max_padding_fraction = 0.25
# How far apart two neighbouring chunks may place the same word in time
# (feature frames of 10 ms). Measured drift reaches about 0.5 s, so 100 frames
# (1.0 s) leaves margin. 0 disables overlap alignment at chunk seams.
merge_tolerance_feature_frames = 100
# Decoder collapse recovery. On some windows the model skips seconds of clear
# speech (the reference implementation does the same on the same samples).
# A stretch of a chunk's core longer than untranscribed_gap_seconds with no
# word, whose RMS is at least gap_silence_rms (about -60 dBFS), is re-decoded
# with the window start moved by each offset in turn (feature frames of 10 ms,
# at most overlap_feature_frames in size). An empty list disables recovery.
untranscribed_gap_seconds = 4.0
gap_silence_rms = 0.001
recovery_start_offsets_feature_frames = [-25, 25, -50, 50]
# Minimum wall-clock gap between two terminal progress lines.
progress_interval_seconds = 2.0
# Most decoders of multi-chunk files open at the same time, and the most such
# files in progress. Each decoder is a file handle (or an ffmpeg process for
# formats libsndfile cannot read) and holds an overlap tail until its last
# chunk, so a folder of hundreds of long files must not open them all at
# once. A long file gets several decoders (see decode_workers) only while
# fewer files are in progress. Single-chunk files do not count.
max_open_files = 8
# Precision of the acoustic encoder: "auto", "float16", or "float32".
# Float16 is about 2.8 times faster in the encoder and halves its weights; on
# two labeled podcasts (110 minutes) the word error rate was the same as
# float32. "auto": float16 on NVIDIA GPUs with tensor cores (compute
# capability 7.0 and newer), float32 on older GPUs, the CPU, and other
# accelerators. The decoder and joint always run in float32.
encoder_precision = "auto"
# NVIDIA GPUs only: replay each greedy decoding step as one captured CUDA Graph
# instead of about 46 separate kernel launches. Same output, 3 to 5 times
# faster decoding loop on the RTX 3050 Ti. Other devices ignore it.
cuda_graphs = true
# Float32 matrix products: "highest" (exact) or "high" (TF32 tensor cores on
# NVIDIA Ampere and newer). Matters when encoder_precision is "float32": the
# encoder then ran 28 percent faster with the same tokens on sampled batches.
# With the float16 encoder only the decoder and joint use float32 products.
float32_matmul_precision = "highest"
# CUDA float16 encoder only: matrix products also add in float16 (cuBLAS).
# The encoder ran 1.17 times faster on the RTX 3050 Ti, and the word error
# rate on the docs corpus was 6.66 percent against 6.67 without it. "auto":
# a short benchmark at startup turns it on only where it is at least 25
# percent faster (1.68 to 1.84 times on the RTX 3050 Ti; a GPU that adds in
# float32 at full speed keeps the more precise float32 sums). The margin keeps
# the decision, and the transcripts, the same from run to run.
float16_accumulation = "auto"
# Threads that decode and resample audio while the GPU runs. A long file that
# libsndfile reads (WAV, FLAC, MP3, ...) is dealt to up to this many decoders
# in blocks of chunks, so each batch is decoded in parallel; chunks of
# different files in one batch are decoded in parallel too. Files decoded
# through ffmpeg stay one decoder each. Raw MP3 decoding of a 74-minute file
# took 4.4 s on 1 thread, 3.1 s on 2, 2.3 s on 4 and 2.5 s on 8, with 16
# logical CPUs. "auto": one thread per four logical CPUs, 1 to 8.
decode_workers = "auto"

[memory]
# NVIDIA GPUs only (ignored on the CPU and other accelerators). After the
# model loads, PyTorch is capped to the VRAM that is actually free minus
# reserve_mib. On Windows an
# over-allocation would otherwise spill silently into shared system memory and
# run several times slower instead of failing.
cap_to_free_memory = true
# Measure the memory of one and of three full chunks after loading: how many
# full chunks fit under that cap. inference.batch_size = "auto" is chosen from
# it, and configured numbers (batch_size, max_batch_feature_frames) are
# lowered to it when needed, never raised. false: batch_size "auto" is 16.
auto_batch_budget = true
# VRAM left outside the cap, measured after calibration has already loaded
# the libraries: room for kernels loaded later and for other programs.
reserve_mib = 256
# inference.batch_size = "auto" uses this share of the full chunks that fit
# (0 to 1). The rest covers what the calibration cannot see: memory per row
# grows a little with the batch (55 MiB from 1 to 8 rows, about 60 from 16 to
# 31 on the reference GPU) and fragmentation across batches. 34 chunks fit
# there and 0.7 gives 23 rows; 31 rows ran out of memory in the second batch
# of a long file. Lower it if a run stops with an out-of-memory error.
auto_batch_memory_share = 0.7
# Most rows "auto" picks on large GPUs: 64 full chunks are about 12 000
# encoder frames per matrix product, while the audio and decoding buffers
# held per batch keep growing with the rows.
auto_batch_max_rows = 64
# Rows for batch_size = "auto" when nothing was measured: the CPU, Apple MPS
# and other accelerators, or auto_batch_budget = false.
unmeasured_batch_rows = 16

[benchmark]
# Development benchmark: rounds run and discarded before measuring (CUDA
# kernel selection, file cache), then rounds that are measured and compared.
warmup_rounds = 1
measured_rounds = 3
# Limit for each git query that records the commit in a benchmark record; on
# timeout the commit is recorded as unknown instead of blocking the run.
git_timeout_seconds = 30.0
